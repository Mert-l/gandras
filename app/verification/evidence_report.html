<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evidence report · The Earth Has Receipts</title>
<style>
*{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#eef2ef;color:#192d26;margin:0}main{max-width:1200px;margin:auto;padding:36px}h1{font-size:38px;line-height:1.15}h2{font-size:23px}section,header{background:white;border:1px solid #cbd7cf;border-radius:12px;padding:24px;margin-bottom:20px}small,.muted{color:#52655b}button{font:inherit;cursor:pointer;border:1px solid #537262;border-radius:6px;background:white;color:#192d26;padding:10px}button[aria-pressed=true]{background:#153e2c;color:white}.images{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}figure{margin:0;min-width:0}.frame{position:relative}.frame img{display:block;width:100%;height:auto}.highlight{position:absolute;border:3px solid #00ffff;box-shadow:0 0 0 2px #10271f;pointer-events:none}figcaption{overflow-wrap:anywhere;font-size:13px}.findings{display:flex;flex-wrap:wrap;gap:8px}.verdict{border-left:6px solid #987222}.supported{border-color:#27845c}.contradicted{border-color:#c34b35}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;vertical-align:top;padding:8px;border-bottom:1px solid #dce3dd;overflow-wrap:anywhere}td:first-child{width:38%}pre{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:12px;margin-bottom:20px}#selection{font-weight:600}a{color:#175c43}@media(max-width:800px){main{padding:16px}.images{grid-template-columns:1fr}h1{font-size:28px}}@media print{body{background:white}main{padding:0}.actions{display:none}section,header{break-inside:avoid;padding:14px}.images{grid-template-columns:repeat(3,minmax(0,1fr))}button{color:black!important;background:white!important}h1{font-size:28px}}
</style></head><body><main><div class="actions"><button id="print">Print / Save as PDF</button><button id="reset">Clear region selection</button></div><header id="header"></header><section id="answer" class="verdict"></section><section><h2>Satellite evidence</h2><p>Images share the analysis grid. Select a finding to mark its bounding region on all three views. Boxes locate regions; the overlay shows detected pixels.</p><p id="selection" role="status" aria-live="polite">No region selected</p><div id="images" class="images"></div><p id="legend"></p><h3>Individual findings</h3><div id="findings" class="findings"></div><div id="detail"></div></section><div id="sections"></div></main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const d=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id);
function node(tag,text,parent){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(parent)parent.append(n);return n;}
function section(title){const s=node('section',undefined,$('sections'));node('h2',title,s);return s;}
function list(items,parent){if(!items?.length){node('p','None recorded.',parent);return;}const ul=node('ul',undefined,parent);items.forEach(x=>node('li',typeof x==='string'?x:JSON.stringify(x),ul));}
function table(obj,parent,prefix=''){const t=node('table',undefined,parent);const body=node('tbody',undefined,t);function rows(o,p){Object.entries(o||{}).forEach(([k,v])=>{if(v&&typeof v==='object'&&!Array.isArray(v)){rows(v,p+k+'.');return;}const tr=node('tr',undefined,body);node('th',p+k,tr).scope='row';node('td',typeof v==='object'?JSON.stringify(v):String(v??'Not recorded'),tr);});}rows(obj,prefix);}
node('small','THE EARTH HAS RECEIPTS · EVIDENCE REPORT',$('header'));node('h1',d.claim,$('header'));
node('p',`${d.investigation_id} · Status: ${d.status} · Report state: ${d.updated_at||'not recorded'}`,$('header'));
if(d.location)node('p',`${d.location.name||'Investigation area'} · ${d.location.latitude}, ${d.location.longitude} · ${d.location.width_km} km width`,$('header'));
if(d.from_cache)node('p','Replayed from cache. Acquisition timestamps below describe the evidence dates.',$('header'));
const v=d.verdict||{};node('h2',`Verdict: ${v.status||'Pending'} · ${v.confidence||'Unassessed'} confidence`,$('answer'));$('answer').classList.add(v.status||'pending');node('p',v.summary||'No final answer is available for this investigation.',$('answer'));if(d.status!=='completed')node('p','This report is incomplete; the investigation has not completed.',$('answer'));
const boxes=[];
(d.images||[]).forEach(im=>{const f=node('figure',undefined,$('images'));node('h3',im.role,f);const frame=node('div',undefined,f);frame.className='frame';if(im.data){const image=node('img',undefined,frame);image.src=im.data;image.alt=im.role+' satellite evidence';const box=node('div',undefined,frame);box.className='highlight';box.hidden=true;boxes.push(box);}else node('p','Image unavailable.',frame);node('figcaption',[im.scene_id,im.acquired_at||im.date].filter(Boolean).join(' · ')||'Derived from the selected scene pair',f);});
const m=d.measurements||{},grid=d.methodology?.grid||{};
$('legend').textContent=Object.entries(m.overlay_legend||{}).map(([k,v])=>k+': '+v).join(' · ');
const buttons=[];function select(r,button){buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));const bounds=r?.bbox_px;const valid=bounds?.length===4&&bounds.every(Number.isFinite)&&grid.width>0&&grid.height>0;boxes.forEach(b=>{b.hidden=!valid;if(valid){const[x,y,w,h]=bounds;b.style.left=100*x/grid.width+'%';b.style.top=100*y/grid.height+'%';b.style.width=100*w/grid.width+'%';b.style.height=100*h/grid.height+'%';}});$('selection').textContent=r?`Finding ${r.id}: ${r.area_ha} ha. ${valid?'Cyan boxes show its bounds.':'Region geometry unavailable.'}`:'No region selected';$('detail').replaceChildren();if(r)table(r,$('detail'));}
(m.regions||[]).forEach(r=>{const b=node('button',`Region ${r.id} · ${r.area_ha} ha`,$('findings'));b.type='button';b.setAttribute('aria-pressed','false');b.onclick=()=>select(r,b);buttons.push(b);});if(!buttons.length)node('p','No qualifying change regions reported. This does not prove that no change occurred.',$('findings'));
$('reset').onclick=()=>select(null,null);$('print').onclick=()=>window.print();
for(const[key,title]of [['observed','Observed'],['inferred','Inferred'],['not_established','Not established'],['rationale','Verdict rationale']])list(v[key],section(title));
if(d.headline) table(d.headline,section('Key result'));
table(Object.fromEntries(Object.entries(m).filter(([k])=>k!=='regions')),section('Metrics'));
table(d.methodology,section('Methodology'));
const sources=section('Sources and acquisition timestamps');if(!d.sources?.length)node('p','No source records available.',sources);
(d.sources||[]).forEach(s=>{table(s,sources);if(/^https?:\/\//i.test(s.url||'')){const a=node('a','Open source record',sources);a.href=s.url;a.rel='noopener noreferrer';a.target='_blank';}});
list([...new Set([...(d.limitations||[]),...(v.limitations||[])])],section('Limitations'));
</script></body></html>
